name: Auto release desktop (macOS + Windows)

# Build-first auto-release: on push to uat (or manual), if the desktop version in
# tauri.conf.json has no matching release yet, build BOTH installers — macOS .dmg and
# Windows .exe (NSIS) — and, on success, auto-create the tag `desktop-v<version>` +
# GitHub Release and upload the artifacts (+ a combined updater latest.json).
#
# Layout: build jobs (macos, windows) only produce artifacts; a single `release` job
# creates the tag/Release and uploads everything — so the two builds never race on
# release creation. (The tag is created via GITHUB_TOKEN, which does NOT re-trigger
# release-dmg.yml.)

on:
  push:
    branches: [uat]
    paths:
      - 'desktop/**'
      - '.github/workflows/auto-release-dmg.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release-desktop
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      proceed: ${{ steps.v.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          TAG="desktop-v$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "→ release $TAG already exists — nothing to do (bump version to release)"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "→ new version $TAG — will build + release"
          fi

  # ── macOS .dmg (+ updater .app.tar.gz/.sig) → workflow artifact ────────────────
  macos:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: macos-latest          # arm64 (aarch64-apple-darwin)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tauri CLI deps
        working-directory: desktop
        run: npm ci

      - name: Prepare notary key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          if [ -n "$APPLE_API_KEY_B64" ]; then
            echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Build .dmg (icons → sidecar → tauri)
        working-directory: desktop
        run: bash scripts/build.sh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage macOS artifacts
        run: |
          mkdir -p dist
          B=desktop/src-tauri/target/release/bundle
          cp "$B"/dmg/*.dmg dist/ 2>/dev/null || true
          cp "$B"/macos/AppPreview.app.tar.gz dist/ 2>/dev/null || true
          cp "$B"/macos/AppPreview.app.tar.gz.sig dist/ 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  # ── macOS Intel .dmg (+ updater .app.tar.gz/.sig) → workflow artifact ──────────
  # Built natively on an Intel runner: the PyInstaller Python sidecar can't
  # cross-compile, so an x86_64 sidecar requires an x86_64 host. macos-13 is the
  # last Intel-based GitHub-hosted runner. Updater bundle is renamed to
  # AppPreview_x64.app.tar.gz so it never collides with the aarch64 one.
  macos_intel:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: macos-13              # x86_64 (Intel — x86_64-apple-darwin)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tauri CLI deps
        working-directory: desktop
        run: npm ci

      - name: Prepare notary key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          if [ -n "$APPLE_API_KEY_B64" ]; then
            echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Build .dmg (icons → sidecar → tauri)
        working-directory: desktop
        run: bash scripts/build.sh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage macOS Intel artifacts
        run: |
          mkdir -p dist
          B=desktop/src-tauri/target/release/bundle
          cp "$B"/dmg/*.dmg dist/ 2>/dev/null || true
          # Rename the updater bundle so it doesn't collide with the aarch64 one.
          cp "$B"/macos/AppPreview.app.tar.gz dist/AppPreview_x64.app.tar.gz 2>/dev/null || true
          cp "$B"/macos/AppPreview.app.tar.gz.sig dist/AppPreview_x64.app.tar.gz.sig 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-intel
          path: dist/*
          if-no-files-found: error

  # ── Windows .exe NSIS (+ updater .sig) → workflow artifact ─────────────────────
  windows:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: windows-latest        # x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tauri CLI deps
        working-directory: desktop
        run: npm ci

      - name: App icons (from committed icon-source.png)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli icon src-tauri/icon-source.png

      - name: Build Python sidecar (PyInstaller → serve-*.exe)
        working-directory: desktop
        shell: bash
        env:
          PYTHON: python
        run: bash scripts/build-sidecar.sh

      # Bundle UxPlay + GStreamer (AirPlay mirror) into src-tauri/tools/ via MSYS2.
      # Non-fatal: on failure the app ships without it and AirPlay falls back to a
      # system UxPlay/GStreamer install.
      - name: Setup MSYS2 (UCRT64) for UxPlay + GStreamer
        uses: msys2/setup-msys2@v2
        continue-on-error: true
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
            git

      - name: Bundle UxPlay + GStreamer (AirPlay)
        continue-on-error: true
        shell: msys2 {0}
        run: cd desktop && bash scripts/build-uxplay-gstreamer.sh windows

      - name: Build Windows installer (.exe NSIS)
        working-directory: desktop
        # Updater signing (signs the NSIS bundle → .sig for auto-update). Unsigned
        # installer otherwise (no Authenticode cert yet → SmartScreen may warn once).
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli build --bundles nsis

      - name: Stage Windows artifacts
        shell: bash
        run: |
          mkdir -p dist
          B=desktop/src-tauri/target/release/bundle/nsis
          cp "$B"/*-setup.exe dist/ 2>/dev/null || true
          cp "$B"/*-setup.exe.sig dist/ 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  # ── Single release job: gather artifacts, build latest.json, create tag+Release ─
  release:
    needs: [check, macos, macos_intel, windows]
    # Ship as long as the macOS (arm64) build succeeded; Intel and Windows are
    # included only when they also succeeded, so a failure of either never blocks
    # the macOS release.
    if: always() && needs.check.outputs.proceed == 'true' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: dist

      - name: Download macOS Intel artifacts
        if: needs.macos_intel.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dist-macos-intel
          path: dist

      - name: Download Windows artifacts
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist

      - name: Build combined updater manifest (latest.json)
        env:
          VER: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          PUB=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - "$VER" "$PUB" "$BASE" <<'PY'
          import json, sys, glob, os
          ver, pub, base = sys.argv[1:4]
          platforms = {}

          # macOS (aarch64) — updater downloads the .app.tar.gz; sig is its .sig.
          mac_sig = "dist/AppPreview.app.tar.gz.sig"
          if os.path.exists(mac_sig):
              platforms["darwin-aarch64"] = {
                  "signature": open(mac_sig).read().strip(),
                  "url": f"{base}/AppPreview.app.tar.gz",
              }

          # macOS (x86_64 / Intel) — separate updater bundle (AppPreview_x64.app.tar.gz).
          mac_x64_sig = "dist/AppPreview_x64.app.tar.gz.sig"
          if os.path.exists(mac_x64_sig):
              platforms["darwin-x86_64"] = {
                  "signature": open(mac_x64_sig).read().strip(),
                  "url": f"{base}/AppPreview_x64.app.tar.gz",
              }

          # Windows (x86_64) — updater downloads the NSIS setup.exe; sig is its .sig.
          win_sig = glob.glob("dist/*-setup.exe.sig")
          if win_sig:
              fname = os.path.basename(win_sig[0])[:-4]  # strip ".sig"
              platforms["windows-x86_64"] = {
                  "signature": open(win_sig[0]).read().strip(),
                  "url": f"{base}/{fname}",
              }

          if not platforms:
              print("no updater signatures found — skipping latest.json")
              sys.exit(0)
          json.dump({"version": ver, "pub_date": pub, "platforms": platforms},
                    open("dist/latest.json", "w"), indent=2)
          print("wrote latest.json for platforms:", ", ".join(platforms))
          PY
          ls -la dist

      - name: Create tag + Release and upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.dmg
            dist/AppPreview.app.tar.gz
            dist/AppPreview.app.tar.gz.sig
            dist/AppPreview_x64.app.tar.gz
            dist/AppPreview_x64.app.tar.gz.sig
            dist/*-setup.exe
            dist/latest.json
          fail_on_unmatched_files: false
          body: |
            App Preview — desktop build (auto-released from uat).

            • macOS Apple Silicon (`*_aarch64.dmg`): for M1/M2/M3/M4 Macs.
            • macOS Intel (`*_x64.dmg`): for older Intel Macs.
              Both are signed with Developer ID & notarized — open with no Gatekeeper warning.
            • Windows (.exe): NSIS installer. Not Authenticode-signed yet, so SmartScreen may warn once
              → click "More info" ▸ "Run anyway". The app itself runs fine.

            Auto-update enabled on both platforms (File ▸ Check for Updates…).

            (If the Apple signing secrets are unset, the macOS build falls back to unsigned;
            then run `xattr -dr com.apple.quarantine "/Applications/AppPreview.app"` to open.)
