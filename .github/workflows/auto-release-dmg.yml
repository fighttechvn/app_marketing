name: Auto release DMG

# Build-first auto-release: on push to main (or manual), if the desktop version in
# tauri.conf.json has no matching release yet, build the .dmg and — on success —
# auto-create the tag `desktop-v<version>` + GitHub Release and upload the artifacts.
# (The tag is created via GITHUB_TOKEN, which does NOT re-trigger release-dmg.yml.)

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/auto-release-dmg.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release-dmg
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      proceed: ${{ steps.v.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          TAG="desktop-v$VER"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "→ release $TAG already exists — nothing to do (bump version to release)"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "→ new version $TAG — will build + release"
          fi

  release:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tauri CLI deps
        working-directory: desktop
        run: npm ci

      - name: Prepare notary key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          if [ -n "$APPLE_API_KEY_B64" ]; then
            echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Build .dmg (icons → sidecar → tauri)
        working-directory: desktop
        run: bash scripts/build.sh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate updater manifest
        run: |
          B=desktop/src-tauri/target/release/bundle/macos
          SIG_FILE="$B/AppPreview.app.tar.gz.sig"
          if [ ! -f "$SIG_FILE" ]; then echo "no updater .sig — skipping latest.json"; exit 0; fi
          VER=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          SIG=$(cat "$SIG_FILE")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ needs.check.outputs.tag }}/AppPreview.app.tar.gz"
          PUB=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 -c 'import json,sys; v,p,u,s,o=sys.argv[1:6]; open(o,"w").write(json.dumps({"version":v,"pub_date":p,"platforms":{"darwin-aarch64":{"signature":s,"url":u}}},indent=2))' "$VER" "$PUB" "$URL" "$SIG" "$RUNNER_TEMP/latest.json"
          echo "LATEST_JSON=$RUNNER_TEMP/latest.json" >> "$GITHUB_ENV"

      - name: Create tag + Release and upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/AppPreview.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/AppPreview.app.tar.gz.sig
            ${{ env.LATEST_JSON }}
          fail_on_unmatched_files: false
          body: |
            App Preview — macOS desktop build (auto-released from main). Auto-update enabled.

            Not notarized by Apple → macOS may say "AppPreview is damaged". To open:
            `xattr -dr com.apple.quarantine "/Applications/AppPreview.app"` then launch.
