name: Deploy site to GitHub Pages

# Builds the full static site (landing + Playground + docs) and publishes it to
# https://fighttechvn.github.io/app_marketing/. The Playground's backend features
# (Sync / Test / Try-template) need the local server and are inert on Pages.

on:
  push:
    branches: [uat]
    paths:
      - 'home.html'
      - 'index.html'
      - 'listing*.json'
      - 'assets/**'
      - 'screenshots/**'
      - 'docs/**'
      - 'resources/**'
      - 'srs-index.html'
      - 'scripts/build-pages.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22          # Astro 6/7 require Node >= 22.12.0
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Assemble full site (landing + playground + docs)
        run: bash scripts/build-pages.sh
        env:
          PAGES_BASE: /app_marketing
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
