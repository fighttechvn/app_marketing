name: Build macOS DMG

# Builds the App Preview desktop app (.dmg) on a macOS runner.
# - On a tag push (desktop-v* / v*): attaches the .dmg to that tag's Release.
# - On manual run: uploads the .dmg as a workflow artifact.

on:
  push:
    tags:
      - 'desktop-v*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write          # create/upload release assets

jobs:
  dmg:
    runs-on: macos-latest  # arm64 (aarch64-apple-darwin)
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python (for the PyInstaller sidecar)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tauri CLI deps
        working-directory: desktop
        run: npm ci

      # Materialize the notary .p8 from a base64 secret (optional → signed build).
      - name: Prepare notary key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          if [ -n "$APPLE_API_KEY_B64" ]; then
            echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "→ notary key prepared (signed build)"
          else
            echo "→ no APPLE_API_KEY_B64 secret — unsigned/un-notarized build"
          fi

      - name: Build .dmg (icons → sidecar → tauri)
        working-directory: desktop
        run: bash scripts/build.sh
        env:
          # Signing + notarization. Leave the secrets unset → unsigned (ad-hoc) build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Tauri updater signing (signs the .app.tar.gz → .sig for auto-update).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Build the updater manifest (latest.json) from the signed .app.tar.gz.
      - name: Generate updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          B=desktop/src-tauri/target/release/bundle/macos
          SIG_FILE="$B/AppPreview.app.tar.gz.sig"
          if [ ! -f "$SIG_FILE" ]; then echo "no updater .sig (TAURI_SIGNING_PRIVATE_KEY unset?) — skipping"; exit 0; fi
          VER=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          SIG=$(cat "$SIG_FILE")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/AppPreview.app.tar.gz"
          PUB=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 -c 'import json,sys; v,p,u,s,o=sys.argv[1:6]; open(o,"w").write(json.dumps({"version":v,"pub_date":p,"platforms":{"darwin-aarch64":{"signature":s,"url":u}}},indent=2))' "$VER" "$PUB" "$URL" "$SIG" "$RUNNER_TEMP/latest.json"
          echo "LATEST_JSON=$RUNNER_TEMP/latest.json" >> "$GITHUB_ENV"
          echo "wrote latest.json for v$VER"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-preview-macos-dmg
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # .dmg (manual download) + .app.tar.gz + .sig + latest.json (auto-updater)
          files: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/AppPreview.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/AppPreview.app.tar.gz.sig
            ${{ env.LATEST_JSON }}
          fail_on_unmatched_files: false
          body: |
            App Preview — macOS desktop build (Tauri + Python sidecar).
            Signed with Developer ID & notarized by Apple — opens with no Gatekeeper warning.
            Auto-update enabled (File ▸ Check for Updates…).

            (If the Apple signing secrets are unset, the build falls back to unsigned;
            then run `xattr -dr com.apple.quarantine "/Applications/AppPreview.app"` to open.)
