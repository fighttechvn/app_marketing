name: Build macOS DMG

# Builds the App Preview desktop app (.dmg) on a macOS runner.
# - On a tag push (desktop-v* / v*): attaches the .dmg to that tag's Release.
# - On manual run: uploads the .dmg as a workflow artifact.

on:
  push:
    tags:
      - 'desktop-v*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write          # create/upload release assets

jobs:
  dmg:
    runs-on: macos-latest  # arm64 (aarch64-apple-darwin)
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Python (for the PyInstaller sidecar)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tauri CLI deps
        working-directory: desktop
        run: npm ci

      # Materialize the notary .p8 from a base64 secret (optional → signed build).
      - name: Prepare notary key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          if [ -n "$APPLE_API_KEY_B64" ]; then
            echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "→ notary key prepared (signed build)"
          else
            echo "→ no APPLE_API_KEY_B64 secret — unsigned/un-notarized build"
          fi

      - name: Build .dmg (icons → sidecar → tauri)
        working-directory: desktop
        run: bash scripts/build.sh
        env:
          # Signing + notarization. Leave the secrets unset → unsigned (ad-hoc) build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-preview-macos-dmg
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
          body: |
            App Preview — macOS desktop build.
            Unsigned: on first launch, right-click the app → **Open** if Gatekeeper warns.
