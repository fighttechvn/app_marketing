<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App Preview</title>
<style>
  html,body{height:100%;margin:0;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#0d0f12;color:#9aa1ad;display:grid;place-items:center}
  .box{text-align:center}
  .spin{width:34px;height:34px;margin:0 auto 16px;border:3px solid #262b33;border-top-color:#4c9bff;
    border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="box"><div class="spin"></div>Starting the local server…</div>
</body>
</html>
