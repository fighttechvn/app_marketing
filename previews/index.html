<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Previews</title>
<style>
  :root{--ink:#1d1d1f;--muted:#6e6e73;--line:#e3e3e6;--bg:#f5f5f7;--card:#fff;--accent:#01875f;--on-accent:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme:dark){:root{--ink:#f2f2f4;--muted:#a1a1a6;--line:#2c2c30;--bg:#111113;--card:#1c1c1f;--accent:#3ddc97;--on-accent:#0b2a1d}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  main{max-width:760px;margin:0 auto;padding:40px 16px 64px}
  h1{font-size:26px;margin:0 0 6px}
  p.lead{color:var(--muted);margin:0 0 28px;line-height:1.5}
  .app{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:16px;margin-bottom:12px}
  .app img{width:64px;height:64px;border-radius:14px;flex:0 0 auto}
  .app .t{font-weight:600;font-size:16px}
  .app .s{color:var(--muted);font-size:14px;margin-top:2px;line-height:1.4}
  .app .pk{color:var(--muted);font-size:12px;margin-top:4px;font-family:ui-monospace,Menlo,monospace}
  .app .go{margin-left:auto;display:flex;gap:8px;flex:0 0 auto}
  a.btn{display:inline-block;padding:8px 14px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:600;
    background:var(--accent);color:var(--on-accent);white-space:nowrap}
  a.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  @media (max-width:560px){.app{flex-wrap:wrap}.app .go{margin-left:0;width:100%}}
</style>
</head>
<body>
<main>
  <h1>Store previews</h1>
  <p class="lead">How each listing will look on Google Play before the app is published. Text, icon, feature graphic and screenshots are the ones that will be uploaded.</p>
  <div id="apps">Loading…</div>
</main>
<script>
fetch('apps.json?t='+Date.now()).then(r=>r.json()).then(apps=>{
  const box=document.getElementById('apps'); box.textContent='';
  for(const a of apps){
    const row=document.createElement('div'); row.className='app';
    const img=document.createElement('img'); img.src=a.icon; img.alt='';
    const txt=document.createElement('div');
    const t=document.createElement('div'); t.className='t'; t.textContent=a.name;
    const s=document.createElement('div'); s.className='s'; s.textContent=a.short;
    const pk=document.createElement('div'); pk.className='pk'; pk.textContent=a.package;
    txt.append(t,s,pk);
    const go=document.createElement('div'); go.className='go';
    const p=document.createElement('a'); p.className='btn'; p.href=a.id+'/?store=googleplay'; p.textContent='Preview';
    const l=document.createElement('a'); l.className='btn ghost'; l.href=a.landing; l.textContent='Website'; l.target='_blank'; l.rel='noopener';
    go.append(p,l);
    row.append(img,txt,go); box.append(row);
  }
}).catch(()=>{document.getElementById('apps').textContent='Could not load the list of previews.';});
</script>
</body>
</html>
